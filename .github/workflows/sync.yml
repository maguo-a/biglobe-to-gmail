name: biglobe-to-gmail

on:
  workflow_dispatch: {}  # GAS(Google Apps Script)から1分おきに呼び出される

# 前回の実行がまだ終わっていない場合、次の実行は「待つ」形にして
# state.jsonの上書き競合(コミットの衝突)を防ぐ
concurrency:
  group: biglobe-to-gmail-sync
  cancel-in-progress: false

# state.jsonをリポジトリにコミットし直すために書き込み権限が必要
permissions:
  contents: write

jobs:
  sync:
    # ubuntu-latestは2026/10/19〜11/19にUbuntu 26.04へ順次移行するため、
    # 意図しないOS変更を避けて24.04に固定する(26.04の検証後に切り替える)
    runs-on: ubuntu-24.04
    # 通信が固まった場合でも、後続の実行を長時間ブロックしないための上限
    # (未指定だとGitHubホストのRunnerでは最大360分=6時間まで待ってしまう)
    timeout-minutes: 15
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6   # Node.js 24対応版

      - name: Pythonをセットアップ
        uses: actions/setup-python@v6   # Node.js 24対応版
        with:
          python-version: "3.12"

      - name: 必要なライブラリをインストール
        run: pip install -r requirements.txt

      - name: メール同期スクリプトを実行
        env:
          # 毎回見る「窓」の日数。初回も2回目以降も常にこの日数を使う。
          SYNC_WINDOW_DAYS: "14"
          BIGLOBE_IMAP_SERVER: ${{ secrets.BIGLOBE_IMAP_SERVER }}
          BIGLOBE_USERNAME: ${{ secrets.BIGLOBE_USERNAME }}
          BIGLOBE_PASSWORD: ${{ secrets.BIGLOBE_PASSWORD }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_TARGET_ADDRESS: ${{ secrets.GMAIL_TARGET_ADDRESS }}
        run: python biglobe_to_gmail.py

      - name: 処理状況(state.json)をリポジトリに保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp state.json /tmp/state.json.new
          saved=0
          for i in 1 2 3 4 5; do
            # 各通信は60秒で打ち切り、固まっても次の試行に進めるようにする
            if ! timeout 60 git fetch origin main; then
              echo "fetchに失敗または時間切れ。再試行します ($i回目)"
              sleep 3
              continue
            fi
            git reset --hard origin/main
            cp /tmp/state.json.new state.json
            git add state.json
            if git diff --cached --quiet; then
              echo "変更なし"
              saved=1
              break
            fi
            git commit -m "Update sync state [skip ci]"
            if timeout 60 git push origin HEAD:main; then
              echo "保存成功"
              saved=1
              break
            fi
            echo "pushに失敗または時間切れ。再試行します ($i回目)"
            sleep $((RANDOM % 5 + 1))
          done
          if [ "$saved" != 1 ]; then
            echo "state.jsonを保存できませんでした(次回の実行で重複投入の可能性があります)"
            exit 1
          fi
